<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="600" height="460" role="img" aria-labelledby="t d">
  <title id="t">Two layers</title>
  <desc id="d">knowledge-keeping sits on top. It needs a rule on who holds the pen, from delegation-contract, and leans on measure-before-asserting. The foundation is the agent collaboration layer: delegation-contract, measure-before-asserting and session-handover.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 22px; font-weight: 600; }
    .t2 { font-size: 20px; font-weight: 600; }
    .m { font-size: 18px; }
    .s { font-size: 17px; fill: #59636e; }
    .k { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  </style>
  <rect class="card" x="10" y="10" width="580" height="118" rx="10"/><rect x="10" y="10" width="580" height="6" rx="3" fill="#0969da"/>
  <text x="28" y="44" class="k" text-anchor="start">KNOWLEDGE LAYER, ON TOP</text>
  <text x="28" y="76" class="t" text-anchor="start">knowledge-keeping</text>
  <text x="28" y="106" class="m" text-anchor="start">one place per fact, provenance, supersede, expiry on use</text>
  <line x1="103" y1="128" x2="103.0" y2="226.0" stroke="#59636e" stroke-width="2.5"/><path d="M 103 238 L 109.0 226.0 L 97.0 226.0 z" fill="#59636e"/>
  <text x="117" y="172" class="m" text-anchor="start">needs a rule on</text>
  <text x="117" y="194" class="m" text-anchor="start">who holds the pen</text>
  <line x1="300" y1="128" x2="300.0" y2="226.0" stroke="#59636e" stroke-width="2.5"/><path d="M 300 238 L 306.0 226.0 L 294.0 226.0 z" fill="#59636e"/>
  <text x="314" y="183" class="m" text-anchor="start">leans on</text>
  <rect class="card" x="10" y="240" width="186" height="160" rx="10"/><rect x="10" y="240" width="186" height="6" rx="3" fill="#1a7f37"/>
  <text x="103" y="276" class="t2" text-anchor="middle">delegation-</text>
  <text x="103" y="300" class="t2" text-anchor="middle">contract</text>
  <text x="103" y="346" class="s" text-anchor="middle">who leads, who</text>
  <text x="103" y="368" class="s" text-anchor="middle">holds the pen</text>
  <rect class="card" x="207" y="240" width="186" height="160" rx="10"/><rect x="207" y="240" width="186" height="6" rx="3" fill="#1a7f37"/>
  <text x="300" y="276" class="t2" text-anchor="middle">measure-before-</text>
  <text x="300" y="300" class="t2" text-anchor="middle">asserting</text>
  <text x="300" y="346" class="s" text-anchor="middle">look it up</text>
  <text x="300" y="368" class="s" text-anchor="middle">before saying it</text>
  <rect class="card" x="404" y="240" width="186" height="160" rx="10"/><rect x="404" y="240" width="186" height="6" rx="3" fill="#1a7f37"/>
  <text x="497" y="276" class="t2" text-anchor="middle">session-</text>
  <text x="497" y="300" class="t2" text-anchor="middle">handover</text>
  <text x="497" y="346" class="s" text-anchor="middle">close as the</text>
  <text x="497" y="368" class="s" text-anchor="middle">last step</text>
  <path d="M 10 414 H 590" stroke="#1a7f37" stroke-width="4" stroke-linecap="round"/>
  <text x="300" y="444" class="k" text-anchor="middle">AGENT COLLABORATION LAYER, THE FOUNDATION</text>
</svg>
