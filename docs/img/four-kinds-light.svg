<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 634" width="600" height="634" role="img" aria-labelledby="t d">
  <title id="t">Four kinds of rules</title>
  <desc id="d">Enforced: something really stops you. Enforceable, not enforced: a mechanism is possible and nobody has built it. Reserved to a person: the rule's content is a person's decision. Behaviour rule: it holds only as long as the discipline does. Each with an example from this repository.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 22px; font-weight: 600; }
    .t2 { font-size: 20px; font-weight: 600; }
    .m { font-size: 18px; }
    .s { font-size: 17px; fill: #59636e; }
    .k { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  </style>
  <rect class="card" x="10" y="10" width="285" height="300" rx="10"/><rect x="10" y="10" width="285" height="6" rx="3" fill="#1a7f37"/>
  <rect x="26" y="50" width="8" height="44" rx="2" fill="#1a7f37"/><rect x="98" y="50" width="8" height="44" rx="2" fill="#1a7f37"/><rect x="34" y="65" width="64" height="14" rx="3" fill="#1a7f37"/>
  <text x="122" y="80" class="t" text-anchor="start">Enforced</text>
  <text x="28" y="142" class="m" text-anchor="start">Something really</text>
  <text x="28" y="165" class="m" text-anchor="start">stops you.</text>
  <line x1="28" y1="194" x2="277" y2="194" stroke="#d1d9e0" stroke-width="1"/>
  <text x="28" y="222" class="k" text-anchor="start">FOR EXAMPLE</text>
  <text x="28" y="248" class="s" text-anchor="start">The pre-push hook refuses</text>
  <text x="28" y="270" class="s" text-anchor="start">an undeclared identity.</text>
  <rect class="card" x="305" y="10" width="285" height="300" rx="10"/><rect x="305" y="10" width="285" height="6" rx="3" fill="#9a6700"/>
  <rect x="321" y="50" width="8" height="44" rx="2" fill="none" stroke="#9a6700" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="393" y="50" width="8" height="44" rx="2" fill="none" stroke="#9a6700" stroke-width="2.5" stroke-dasharray="6 5"/><rect x="329" y="65" width="64" height="14" rx="3" fill="none" stroke="#9a6700" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="417" y="68" class="t" text-anchor="start">Enforceable,</text>
  <text x="417" y="94" class="t" text-anchor="start">not enforced</text>
  <text x="323" y="142" class="m" text-anchor="start">A mechanism is possible;</text>
  <text x="323" y="165" class="m" text-anchor="start">nobody has built it.</text>
  <line x1="323" y1="194" x2="572" y2="194" stroke="#d1d9e0" stroke-width="1"/>
  <text x="323" y="222" class="k" text-anchor="start">FOR EXAMPLE</text>
  <text x="323" y="248" class="s" text-anchor="start">The five-minute target for</text>
  <text x="323" y="270" class="s" text-anchor="start">a subagent run: measured,</text>
  <text x="323" y="292" class="s" text-anchor="start">never stopped.</text>
  <rect class="card" x="10" y="324" width="285" height="300" rx="10"/><rect x="10" y="324" width="285" height="6" rx="3" fill="#0969da"/>
  <circle cx="66" cy="376" r="11" fill="#0969da"/><path d="M 44 408 a 22 20 0 0 1 44 0 z" fill="#0969da"/>
  <text x="122" y="382" class="t" text-anchor="start">Reserved to</text>
  <text x="122" y="408" class="t" text-anchor="start">a person</text>
  <text x="28" y="456" class="m" text-anchor="start">The rule's content is a</text>
  <text x="28" y="479" class="m" text-anchor="start">person's decision.</text>
  <line x1="28" y1="508" x2="277" y2="508" stroke="#d1d9e0" stroke-width="1"/>
  <text x="28" y="536" class="k" text-anchor="start">FOR EXAMPLE</text>
  <text x="28" y="562" class="s" text-anchor="start">A contradiction is resolved</text>
  <text x="28" y="584" class="s" text-anchor="start">by a person, not by the</text>
  <text x="28" y="606" class="s" text-anchor="start">newer value.</text>
  <rect class="card" x="305" y="324" width="285" height="300" rx="10"/><rect x="305" y="324" width="285" height="6" rx="3" fill="#8250df"/>
  <path d="M 341 361 h 30 l 10 10 v 40 h -40 z" fill="none" stroke="#8250df" stroke-width="2.5" stroke-linejoin="round"/><path d="M 350 378 h 22 M 350 388 h 18 M 350 398 h 13" stroke="#8250df" stroke-width="2.5" stroke-linecap="round"/>
  <text x="417" y="394" class="t" text-anchor="start">Behaviour rule</text>
  <text x="323" y="456" class="m" text-anchor="start">Holds only as long as</text>
  <text x="323" y="479" class="m" text-anchor="start">the discipline does.</text>
  <line x1="323" y1="508" x2="572" y2="508" stroke="#d1d9e0" stroke-width="1"/>
  <text x="323" y="536" class="k" text-anchor="start">FOR EXAMPLE</text>
  <text x="323" y="562" class="s" text-anchor="start">Reading a page for</text>
  <text x="323" y="584" class="s" text-anchor="start">abstraction: no pattern</text>
  <text x="323" y="606" class="s" text-anchor="start">answers it.</text>
</svg>
