<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-labelledby="t d">
  <title id="t">When the card arrives and when a skill loads</title>
  <desc id="d">The core card arrives by hook at SessionStart and at SubagentStart, before the model frames the work; a skill loads only later, when the task matches its description.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 17px; font-weight: 600; }
    .m { font-size: 15px; }
    .s { font-size: 14px; fill: #59636e; }
    .k { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  </style>
  <text x="16" y="28" class="k">HOOKS, BY THEMSELVES</text>
  <text x="16" y="204" class="k">THE MODEL</text>
  <line x1="16" y1="150" x2="850" y2="150" stroke="#59636e" stroke-width="2"/><path d="M 850 143 L 864 150 L 850 157 z" fill="#59636e"/>
  <text x="864" y="178" class="s" text-anchor="end">time in one session</text>
  <circle cx="110" cy="150" r="6" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
  <circle cx="740" cy="150" r="6" fill="#ffffff" stroke="#59636e" stroke-width="2"/>
  <rect x="16" y="42" width="200" height="78" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="116" y="70" class="t" text-anchor="middle">SessionStart</text>
  <text x="116" y="96" class="m" text-anchor="middle">the core card arrives</text>
  <line x1="110" y1="120" x2="110" y2="144" stroke="#1a7f37" stroke-width="2"/>
  <rect x="628" y="42" width="236" height="78" rx="8" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="746" y="70" class="t" text-anchor="middle">SubagentStart</text>
  <text x="746" y="96" class="m" text-anchor="middle">the same card, for the subagent</text>
  <line x1="740" y1="120" x2="740" y2="144" stroke="#1a7f37" stroke-width="2"/>
  <rect x="140" y="216" width="300" height="92" rx="8" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="290" y="242" class="t" text-anchor="middle">frames the work</text>
  <text x="290" y="268" class="m" text-anchor="middle">who leads, whether to dispatch,</text>
  <text x="290" y="288" class="m" text-anchor="middle">who holds the pen</text>
  <rect x="470" y="216" width="190" height="92" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="2"/>
  <text x="565" y="242" class="t" text-anchor="middle">a skill loads</text>
  <text x="565" y="268" class="m" text-anchor="middle">when the task matches it</text>
  <path d="M 140 172 v -8 h 330 v 8" fill="none" stroke="#9a6700" stroke-width="2"/>
  <text x="305" y="194" class="m" text-anchor="middle" fill="#9a6700" style="fill:#9a6700">the card is already here; the skill is not yet</text>
  <text x="16" y="338" class="s">A card is a floor under the skills, not a replacement for them.</text>
</svg>
