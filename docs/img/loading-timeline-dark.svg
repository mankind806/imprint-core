<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 504" width="600" height="504" role="img" aria-labelledby="t d">
  <title id="t">When the card arrives and when a skill loads</title>
  <desc id="d">The core card arrives by hook at SessionStart and at SubagentStart, before the model frames the work; a skill loads only later, when the task matches its description.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .t { font-size: 22px; font-weight: 600; }
    .t2 { font-size: 20px; font-weight: 600; }
    .m { font-size: 18px; }
    .s { font-size: 17px; fill: #9198a1; }
    .k { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; fill: #9198a1; }
    .card { fill: #161b22; stroke: #3d444d; stroke-width: 1; }
  </style>
  <text x="10" y="26" class="k" text-anchor="start">HOOKS, BY THEMSELVES</text>
  <rect x="10" y="40" width="250" height="108" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="135" y="74" class="t" text-anchor="middle">SessionStart</text>
  <text x="135" y="102" class="m" text-anchor="middle">the core card</text>
  <text x="135" y="124" class="m" text-anchor="middle">arrives</text>
  <rect x="340" y="40" width="250" height="108" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="465" y="74" class="t" text-anchor="middle">SubagentStart</text>
  <text x="465" y="102" class="m" text-anchor="middle">the same card,</text>
  <text x="465" y="124" class="m" text-anchor="middle">for the subagent</text>
  <line x1="10" y1="186" x2="578" y2="186" stroke="#9198a1" stroke-width="2"/><path d="M 576 179 L 590 186 L 576 193 z" fill="#9198a1"/>
  <text x="590" y="214" class="s" text-anchor="end">time in one session</text>
  <line x1="135" y1="148" x2="135" y2="180" stroke="#3fb950" stroke-width="2"/>
  <circle cx="135" cy="186" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="2"/>
  <line x1="465" y1="148" x2="465" y2="180" stroke="#3fb950" stroke-width="2"/>
  <circle cx="465" cy="186" r="6" fill="#0d1117" stroke="#9198a1" stroke-width="2"/>
  <path d="M 150 238 v -8 h 250 v 8" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="275" y="262" class="m" text-anchor="middle" style="fill:#d29922">the card is already here;</text>
  <text x="275" y="284" class="m" text-anchor="middle" style="fill:#d29922">the skill is not yet</text>
  <text x="10" y="336" class="k" text-anchor="start">THE</text>
  <text x="10" y="358" class="k" text-anchor="start">MODEL</text>
  <rect x="150" y="310" width="250" height="126" rx="10" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
  <text x="275" y="342" class="t2" text-anchor="middle">frames the work</text>
  <text x="275" y="370" class="m" text-anchor="middle">who leads, whether</text>
  <text x="275" y="392" class="m" text-anchor="middle">to dispatch, who</text>
  <text x="275" y="414" class="m" text-anchor="middle">holds the pen</text>
  <rect x="415" y="310" width="175" height="126" rx="10" fill="#161b22" stroke="#4493f8" stroke-width="2"/>
  <text x="502" y="342" class="t2" text-anchor="middle">a skill loads</text>
  <text x="502" y="370" class="m" text-anchor="middle">when the task</text>
  <text x="502" y="392" class="m" text-anchor="middle">matches it</text>
  <text x="10" y="470" class="s" text-anchor="start">A card is a floor under the skills,</text>
  <text x="10" y="492" class="s" text-anchor="start">not a replacement for them.</text>
</svg>
