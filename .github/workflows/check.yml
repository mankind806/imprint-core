name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/imprint-dev/go.mod
          # Standard library only, so there is no go.sum to key a cache on.
          cache: false
      - name: go test
        working-directory: tools/imprint-dev
        run: |
          # N16: a run with zero tests counts as red.
          n=$(go test -list '.*' ./... | grep -c '^Test' || true)
          echo "Tests found: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::go test found zero tests; that counts as red (N16)"
            exit 1
          fi
          go test ./...
      - name: imprint-dev check
        run: go run ./tools/imprint-dev check --root . --sarif "$RUNNER_TEMP/imprint-dev.sarif"
      - name: working tree unchanged
        # N16: CI compares the file list before and after the run.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::Tests or the check wrote or changed files in the repository"
            exit 1
          fi
