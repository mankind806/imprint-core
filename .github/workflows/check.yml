name: check

on:
  # push is restricted to main: a feature-branch push would otherwise produce
  # its own, separately green check run on the same commit its pull request
  # is also checked on, and that push run skips commit-check (the condition
  # below), which reads as ambiguous on that SHA rather than as green for a
  # reason. A feature branch is still checked, once its pull request exists,
  # through pull_request below.
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # commit-check needs the commit range, and a push to main needs the
          # commit before it to resolve before..after.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/imprint-dev/go.mod
          # Standard library only, so there is no go.sum to key a cache on.
          cache: false
      - name: go test
        working-directory: tools/imprint-dev
        run: |
          # N16: a run with zero tests counts as red.
          n=$(go test -list '.*' ./... | grep -c '^Test' || true)
          echo "Tests found: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::go test found zero tests; that counts as red (N16)"
            exit 1
          fi
          go test ./...
      - name: Codex arrival test (offline)
        # Fixtures and stub codex/timeout binaries only: no account, no model
        # call. Needs python3 on the runner.
        run: sh tools/test-arrival-codex.sh
      - name: Antigravity arrival test (offline)
        # Fixtures and stub agy/timeout binaries only: no account, no model
        # call. Needs python3 on the runner.
        run: sh tools/test-arrival-agy.sh
      - name: imprint-dev check
        run: go run ./tools/imprint-dev check --root . --sarif "$RUNNER_TEMP/imprint-dev.sarif"
      - name: typesafe Python tests (offline, no key)
        env:
          # CI has no TypeSafe key/network: ts_common.get_key() fails open by
          # design, and the CLI integration tests in test_tools.py accept both
          # the "ok" (live key) and "fail_open" (no key/network, expected
          # here) outcomes. TYPESAFE_NAMES_FILE is written explicitly, with
          # the same synthetic names test_mask_parity.py's own case file
          # lists, so the "name" masking tests in test_tools.py see them
          # regardless of which test module unittest discover picks first
          # (test_mask_parity.py, test_no_leak.py and mask-test.py each use
          # their own temporary names file).
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          printf 'Max Mustermann\nErika Musterfrau\n' >"$RUNNER_TEMP/typesafe-names.txt"
          export TYPESAFE_NAMES_FILE="$RUNNER_TEMP/typesafe-names.txt"
          python3 -m unittest discover -s tools/typesafe -v
          python3 tools/typesafe/tests/mask-test.py
      - name: imprint-dev commit-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # A plain boolean comparison, done by the expression engine itself
          # before this script ever runs; the result is a fixed "true" or
          # "false" string, so head.repo.full_name (attacker-controlled on a
          # fork) is never itself interpolated into anything this script
          # runs — same-repo cannot mean "spoofable" the way the git
          # identities below can be.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          # PR_AUTHOR, PR_TITLE and PR_BODY come from outside the
          # repository, so they are only ever read from this env: block,
          # never interpolated with a double-brace expression into this
          # script (that would even parse as an expression inside a
          # comment, breaking the workflow file).
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
            printf '%s' "$PR_BODY" >"$RUNNER_TEMP/pr-body.txt"
            same_repo_flag=""
            if [ "$SAME_REPO" = "true" ]; then
              same_repo_flag="--same-repo"
            fi
            # --conf-rev reads .imprint/commit.conf from the base commit's
            # own tree, not the pull request's own tree: otherwise a pull
            # request could grant itself an entry by editing the very file
            # it is checked against. It fails clearly, rather than falling
            # back to the pull request's own copy, when the base commit
            # does not have the file at all (N4): this repository has had
            # the file on main since #18, so that is no longer expected.
            go run ./tools/imprint-dev commit-check --root . --range "$range" --conf-rev "$BASE_SHA" $same_repo_flag \
              --pr-author "$PR_AUTHOR" --pr-title "$PR_TITLE" --pr-body-file "$RUNNER_TEMP/pr-body.txt" \
              --sarif "$RUNNER_TEMP/commit-check.sarif"
          else
            # A push's "before" is all-zero (or absent) only when the ref did
            # not exist beforehand; a bare $AFTER as the range would then walk
            # the whole history instead of just the new commit, so this uses
            # the "just this commit" form instead. push is restricted to
            # main above, so this branch only ever runs there.
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$zero" ]; then
              range="${AFTER_SHA}^!"
            else
              range="$BEFORE_SHA..$AFTER_SHA"
            fi
            go run ./tools/imprint-dev commit-check --root . --range "$range" \
              --sarif "$RUNNER_TEMP/commit-check.sarif"
          fi
      - name: working tree unchanged
        # N16: CI compares the file list before and after the run.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --porcelain --untracked-files=all
            echo "::error::Tests or the check wrote or changed files in the repository"
            exit 1
          fi
