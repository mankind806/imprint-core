name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/imprint-dev/go.mod
          # Standard library only, so there is no go.sum to key a cache on.
          cache: false
      - name: go test
        working-directory: tools/imprint-dev
        run: go test ./...
      - name: imprint-dev check
        run: go run ./tools/imprint-dev check --root . --sarif imprint-dev.sarif
