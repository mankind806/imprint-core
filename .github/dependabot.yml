version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
    directory: "/tools/imprint-dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      go-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
